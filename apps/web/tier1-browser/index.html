<!doctype html>
<meta charset="utf-8">
<title>Aero Tier-1 in the browser</title>
<pre id="out">running…</pre>
<script type="module">
// Drives the compiled tier over the browser's own WebAssembly engine. Everything
// above that engine — discovery, translation, dead-flag elimination, codegen — is
// the same code the native build runs.
import init, { tier1_run_block } from './aero_jit_wasm.js';

function hex(s) {
  const out = new Uint8Array(s.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(s.substr(i * 2, 2), 16);
  return out;
}

(async () => {
  try {
    await init();
    // mov rcx,7 ; add rax,rcx ; mov [rsp-16],rax ; mov rbx,[rsp-16] ; add rax,rbx ; ret
    // From RAX=5: 5+7 = 12 -> guest memory -> back -> 12+12 = 24.
    const code = hex('48c7c1070000004801c848894424f0488b5c24f04801d8c3');
    window.__aeroResult = { ok: true, ...tier1_run_block(code, 0x1000, 5) };
  } catch (e) {
    window.__aeroResult = { ok: false, error: String((e && e.stack) || e) };
  }
  document.getElementById('out').textContent = JSON.stringify(window.__aeroResult, null, 2);
})();
</script>
